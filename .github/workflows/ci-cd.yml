name: CI/CD

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            constraints.txt
      - name: Install dependencies
        run: python -m pip install --constraint constraints.txt -e ".[dev]"
      - name: Check dependencies and run tests
        run: |
          python -m pip check
          python -m pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Configure environment
        run: cp .env.example .env
      - name: Validate and start containers
        env:
          # Test-only value. Production must provide its own secret.
          AUTH_SECRET_KEY: ci-test-only-auth-secret-key-at-least-32-characters
        run: |
          docker compose config --quiet
          docker compose up --build --wait --wait-timeout 420
      - name: Check API and PostgreSQL connection
        run: |
          curl --fail --show-error --silent --retry 10 --retry-all-errors --retry-delay 2 --connect-timeout 3 --max-time 5 http://127.0.0.1:8000/health
          curl --fail --show-error --silent --retry 10 --retry-all-errors --retry-delay 2 --connect-timeout 3 --max-time 5 http://127.0.0.1:8000/health/ready
          docker compose exec -T api python -c "from sqlalchemy import text; from src.database.session import get_engine; engine = get_engine(); connection = engine.connect(); assert connection.scalar(text('SELECT 1')) == 1; connection.close(); engine.dispose()"
      - name: Run deterministic PostgreSQL regression suite
        run: |
          docker compose exec -T db sh -c 'createdb -U "$POSTGRES_USER" text2sql_eval'
          EVAL_URL="$(docker compose exec -T api python -c 'from src.config import get_settings; print(get_settings().database_url.set(database="text2sql_eval").render_as_string(hide_password=False))')"
          docker compose exec -T api python evaluation/run_full_eval.py --output /tmp/full_eval.json --summary /tmp/full_eval_summary.md --failures /tmp/full_eval_failures.csv
          docker compose exec -T api python evaluation/analyze_execution_coverage.py --report /tmp/full_eval.json --output /tmp/execution_coverage.json
          docker compose exec -T api python scripts/seed_execution_eval.py --database-url "$EVAL_URL" --coverage-report /tmp/execution_coverage.json
          docker compose exec -T api python evaluation/run_execution_coverage_eval.py --database-url "$EVAL_URL" --report /tmp/full_eval.json --coverage /tmp/execution_coverage.json --output /tmp/execution_coverage_eval.json
          docker compose exec -T api python evaluation/run_result_accuracy_eval.py --database-url "$EVAL_URL" --output /tmp/result_accuracy_eval.json
          docker compose exec -T api python evaluation/run_erp_qa_regression.py --output /tmp/erp_qa_regression.json
          docker compose exec -T api python -c 'import json; coverage = json.load(open("/tmp/execution_coverage_eval.json")); result = json.load(open("/tmp/result_accuracy_eval.json")); erp = json.load(open("/tmp/erp_qa_regression.json")); assert coverage["failed"] == 0; assert result["failed"] == 0; assert erp["summary"]["behavior_failed"] == 0; assert erp["metrics"]["final_result_accuracy"]["accuracy"] >= 0.90; assert erp["metrics"]["cross_tenant_leakage"]["violations"] == 0'
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop containers
        if: always()
        run: docker compose down --volumes

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-main
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Build and publish image
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker build --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$IMAGE:$GITHUB_SHA" --tag "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
      - name: Log out
        if: always()
        run: docker logout ghcr.io
